name: npj-wind-moments
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=2.4.1
  - pandas=3.0.3
  - matplotlib=3.11.0
  - scipy=1.18.0
  - cartopy=0.25.0
  - pillow=12.2.0
  - netcdf4=1.7.4
  - pyproj=3.7.2
  - shapely=2.1.2
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.9.1+cpu
